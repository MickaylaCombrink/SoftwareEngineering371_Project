# Render blueprint for the Scentigue API.
# Create the service from this file, then set the secret values marked
# sync: false in the Render dashboard — they are never committed.
services:
  - type: web
    name: scentigue-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # Browser origins allowed to call this API. The GitHub Pages site plus
      # the local dev server, so one deployment serves both.
      - key: CLIENT_ORIGIN
        value: https://mickaylacombrink.github.io,http://localhost:5173
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Set these in the dashboard, not here
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional: contact-form email. Without SMTP_HOST queries are still
      # saved, the notification is just skipped.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: QUERY_NOTIFY_LIST
        sync: false
