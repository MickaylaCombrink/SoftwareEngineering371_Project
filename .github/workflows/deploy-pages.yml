# Builds the React client and publishes it to GitHub Pages.
#
# Before the first run:
#   Settings > Pages       > Source: GitHub Actions
#   Settings > Secrets and variables > Actions > Variables >
#       New repository variable: VITE_API_BASE_URL = https://<service>.onrender.com/api
#
# The API URL is a variable, not a secret: everything Vite compiles is public
# in the bundle. Real secrets live on Render, never here.
name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Build
        env:
          # Derived from the repository name, so a rename or a fork still works
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
